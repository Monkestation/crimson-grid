      this event, 20% of the graves across the map will spawn 2 zombies max each
  - rscadd: artifacts and all tremere spellbooks can now be sold at pawn shops
  - rscadd: masquerade sensitive items can now be sold at pawnshops, but you may breach
      if you don't pass a manip + subterfuge diff 8 roll
