      soul) from the necromancy tome, which can be sold
  - rscadd: necromancy users can now purchase graveyard keys from their necromancy
      tome, giovanni start with them as they are assumed to control the graveyard's
      mortal front
  - rscadd: adds being able to speak to observer ghosts to necromancy 1 Shroudsight
      similar to spirit speech for Garou
  - balance: Shroudsight now has triple the cooldown (3 minutes -> 9 minutes) to compensate
      for the 'talking to ghosts' trait which has been shown to be too powerful, it
      also now has a vitae cost of 1
  - rscadd: graveyard keys can now open and shut the graveyard gate
  - bugfix: fixes shroudsight double-rolling, it now only rolls it's appropriate roll
      datum (perception) + awareness
  - rscdel: removes the 'graveyard keeper' role
  - code_imp: deletes the 'graveyard' subsystem
  - config: extends the lobby time to 5 minutes, 2 minutes was too short
  - config: multiplies the time between events by 10x since they were firing once
      every 2.5 minutes which is way too short in a 3 hour round
