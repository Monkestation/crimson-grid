2026-10-04:
  JohnFulpWillard:
  - bugfix: Gangrels turning their transformation ability off will now lose their
      Discipline Active alert.
2026-10-05:
  FalloutFalcon:
  - rscadd: All werewolf breeds have 3 unique gifts and every tribe now has atleast
      1 unique gift.
  - rscadd: Adds new werewolf gifts; Primal Anger, Shed, Apecraft's Blessings, City
      Running, Master of Fire, Hare's Leap, Heightened Senses, Predator's Arsenal,
      Falcon's Grasp, Channeling, Sense Magic, Beat of the Heart-Drum
  - refactor: Rolls output targets are based on a set of flags giving more granular
      control of targets including based on success
  - qol: Changes out dice rolls are outputed to be built at the target so the target
      can use the guestbook name of the mob who rolled
  - balance: Slipping restraints now uses a system similar to breaking cuffs that
      uses DEXTERITY + STEALTH to escape
  - bugfix: Fixes oversight where bonus was not always properly added to dice pool
      and only displayed visually
  - code_imp: Rolls pass in an item used in the act if any
  - code_imp: Cleans up helpers for dice roll values like difficulty
  - code_imp: All magic items now return a "magic type" datum with information like
      power or type of magic (e.g blood, spirit, time)
  - code_imp: Adds effects to represent "lingering magic" left by most gifts or discs.
  - code_imp: Reworks Fey Sight to detect items based on magic sources they give off
      rather then all items on a person.
  - code_imp: Organs track who they were last attached to.
  - code_imp: adds a generic system for tracking mobs you've examined to be reused
      for any power that calls for such (Beat of the heart-drum and multiple vampric
      discs)
  Uristthedorf:
  - bugfix: Serpentis 1 no longer implies that it can mind control you.
  breadcrombs:
  - rscadd: Donning the Mask of Shadows makes those under it's effect harder to examine/inspect
